<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consent Guard — Ledger Verify</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1b1f24; background: #f5f6f8; }
    body { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: #57606a; }
    section { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 1rem; margin: 0 0 10px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 180px; font: 12px ui-monospace, Menlo, monospace; }
    input[type=text] { width: 100%; box-sizing: border-box; font: 13px ui-monospace, Menlo, monospace; padding: 6px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; font-size: .9rem; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { font-size: 1rem; padding: 8px 18px; border-radius: 6px; border: 1px solid #1f6feb; background: #1f6feb; color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: #1f6feb; }
    #result { font-size: 1.3rem; font-weight: 700; padding: 20px; border-radius: 8px; word-break: break-all; }
    #result.idle { background: #eaeef2; color: #57606a; }
    #result.green { background: #1a7f37; color: #fff; }
    #result.red { background: #cf222e; color: #fff; }
    #result small { display: block; font-weight: 400; font-size: .95rem; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eaeef2; }
    td.mono { font-family: ui-monospace, Menlo, monospace; }
    tr.bad td { background: #ffebe9; }
    fieldset { border: 0; padding: 0; margin: 0; }
  </style>
</head>
<body>
  <h1>Consent Guard — Ledger Verify</h1>
  <p class="sub">Recomputes the consent ledger hash chain in your browser (WebCrypto sha256) and compares the head with the NEAR anchor. No backend.</p>

  <div id="result" class="idle">Load events and press Verify.</div>

  <section>
    <h2>1. Events</h2>
    <div class="row">
      <input type="file" id="file" accept=".json,application/json">
      <button class="secondary" id="load-sample" type="button">Load sample fixture</button>
    </div>
    <label for="events">Events JSON (array of LedgerEvent, or {"events": [...]})</label>
    <textarea id="events" spellcheck="false" placeholder='[{"seq":0,"kind":"grant",...}]'></textarea>
  </section>

  <section>
    <h2>2. Anchor</h2>
    <fieldset class="row">
      <label><input type="radio" name="source" value="rpc" checked> On-chain (read_anchor via public RPC)</label>
      <label><input type="radio" name="source" value="pasted"> Pasted head hash (offline)</label>
    </fieldset>
    <div class="grid">
      <div>
        <label for="rpc">RPC URL</label>
        <input type="text" id="rpc" value="https://rpc.testnet.near.org" placeholder="https://rpc.testnet.fastnear.com">
      </div>
      <div>
        <label for="contract">Contract account</label>
        <input type="text" id="contract" value="consent-guard-anchor.tee-receipts-chamdom.testnet" placeholder="consent-guard-anchor.tee-receipts-chamdom.testnet">
      </div>
    </div>
    <label for="pasted">Anchor head hash (offline fallback)</label>
    <input type="text" id="pasted" placeholder="64 hex chars, e.g. the head hash printed by scripts/anchor.mjs">
  </section>

  <div class="row" style="margin-bottom:16px"><button id="verify" type="button">Verify</button></div>

  <section>
    <h2>Chain</h2>
    <table>
      <thead><tr><th>seq</th><th>kind</th><th>agent</th><th>dataset</th><th>fields</th><th>refId</th><th>hash</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7">—</td></tr></tbody>
    </table>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
